<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freistellungen bearbeiten</title><link rel="stylesheet" href="/freistellung.css"></head><body><main class="leave"><header><p class="eyebrow">Arcanum · Verwaltung</p><h1>Freistellungen bearbeiten</h1><p>Serverseitig geschützte Bearbeitung für Orgaleitung und Schulleitung.</p></header><section class="card"><label>Status<select id="filter"><option value="">Alle</option><option value="EINGEREICHT">Offen</option><option value="ORGA_RUECKSPRACHE">Orga-Rücksprache</option><option value="ORGA_ABGESCHLOSSEN">Bei Schulleitung</option><option value="ABGESCHLOSSEN">Abgeschlossen</option></select></label><div id="review-list">Lade Vorgänge …</div></section></main><script>
const list=document.querySelector('#review-list'),filter=document.querySelector('#filter');let role={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await fetch('/freistellung-data',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok){list.textContent='Keine Berechtigung.';return}const a=await r.json(),f=filter.value;list.innerHTML=a.filter(x=>!f||x.status===f).map(x=>{const orga=role.orga&&['EINGEREICHT','ORGA_RUECKSPRACHE'].includes(x.status),sl=role.sl&&x.status==='ORGA_ABGESCHLOSSEN';let form='';if(orga)form=`<form method="post" action="/freistellung-orga"><input type="hidden" name="id" value="${esc(x.id)}"><label>Orga-Einschätzung<select name="decision"><option value="GENEHMIGT">genehmigt</option><option value="GENEHMIGT_NACHHALTEN">genehmigt (Stunden müssen nachgehalten werden)</option><option value="NICHT_MOEGLICH">nicht möglich</option><option value="RUECKSPRACHE">Rücksprache erforderlich</option></select></label><label>Interner Kommentar für Schulleitung<textarea name="comment"></textarea></label><button>Orga speichern</button></form>`;if(sl)form=`<form method="post" action="/freistellung-sl"><input type="hidden" name="id" value="${esc(x.id)}"><label>Endgültige Entscheidung<select name="decision"><option value="GENEHMIGT">genehmigt</option><option value="GENEHMIGT_NACHHALTEN">genehmigt (Stunden müssen nachgehalten werden)</option><option value="NICHT_MOEGLICH">nicht möglich</option><option value="RUECKSPRACHE">Rücksprache erforderlich</option></select></label><label>Interner Kommentar für Orga<textarea name="internalComment"></textarea></label><label>Mitteilung an den Kollegen<textarea name="message"></textarea></label><button>Schulleitungsentscheidung speichern</button></form>`;return `<article class="request"><strong>${esc(x.type)}</strong> <span class="status">${esc(x.status)}</span><p>${esc(x.startDate)}–${esc(x.endDate)}, ${esc(x.applicant)}</p>${x.orgaDecision?`<p>Orga: ${esc(x.orgaDecision)}</p>`:''}${x.orgaComment?`<p class="private">Orga-Kommentar: ${esc(x.orgaComment)}</p>`:''}${x.slInternalComment?`<p class="private">SL-intern: ${esc(x.slInternalComment)}</p>`:''}${x.slMessage?`<p>Mitteilung: ${esc(x.slMessage)}</p>`:''}${form}</article>`}).join('')||'Keine Vorgänge.'}filter.addEventListener('change',load);(async()=>{const r=await fetch('/freistellung-role-info',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok){list.textContent='Keine Berechtigung.';return}role=await r.json();load()})();
</script></body></html>
