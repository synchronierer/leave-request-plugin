<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freistellungen bearbeiten</title><link rel="stylesheet" href="/freistellung.css"></head>
<body><main class="leave"><header><p class="eyebrow">Arcanum · Verwaltung</p><h1>Freistellungen bearbeiten</h1><p>Serverseitig geschützte Bearbeitung für Orgaleitung und Schulleitung.</p></header>
<section class="card filters"><label>Status<select id="status"><option value="">Alle</option><option value="EINGEREICHT">Offen</option><option value="ORGA_RUECKSPRACHE">Orga-Rücksprache</option><option value="ORGA_ABGESCHLOSSEN">Bei Schulleitung</option><option value="ABGESCHLOSSEN">Abgeschlossen</option></select></label><label>Schuljahr<input id="schoolYear" placeholder="2026/2027"></label><label>Antragsteller<input id="applicant" placeholder="Konto/E-Mail"></label><label>Antragsart<select id="type"><option value="">Alle</option><option value="FORTBILDUNG">Fortbildung</option><option value="DIENSTLICHE_GRUENDE">Dienstliche Gründe</option><option value="KLASSENFAHRT">Klassenfahrt</option><option value="PERSOENLICHE_GRUENDE">Persönliche Gründe</option><option value="UNTERRICHTSGANG">Unterrichtsgang</option></select></label><button id="apply" type="button">Filter anwenden</button></section>
<section class="card"><div id="review-list">Lade Vorgänge …</div></section>
<dialog id="request-detail"><article><button type="button" data-close-detail>Schließen</button><div id="request-detail-content"></div></article></dialog>
</main>
<script>
const list=document.querySelector('#review-list'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let role={},currentRequests=[];const detail=document.querySelector('#request-detail'),detailContent=document.querySelector('#request-detail-content');
const showDetail=x=>{detailContent.innerHTML=`<h2>Freistellungsantrag</h2><dl><dt>Antragsteller</dt><dd>${esc(x.applicant)}</dd><dt>Antragstellung</dt><dd>${esc(x.createdAt)}</dd><dt>Zeitraum</dt><dd>${esc(x.startDate)}–${esc(x.endDate)}, Stunde ${esc(x.startHour)}–${esc(x.endHour)}</dd><dt>Art/Zweck</dt><dd>${esc(x.type)}</dd><dt>Begründung</dt><dd>${esc(x.reason)}</dd><dt>Lerngruppe</dt><dd>${esc(x.groupName)}</dd><dt>Status</dt><dd>${esc(x.status)}</dd></dl>${x.attachment?`<p><a href="/freistellung-attachment?id=${encodeURIComponent(x.id)}">${esc(x.attachmentName||'PDF-Anhang öffnen')}</a></p>`:''}<h3>Bearbeitungshistorie</h3><ol>${(x.history||[]).map(h=>`<li>${esc(h.at)} · ${esc(h.function)} · ${esc(h.detail)}</li>`).join('')}</ol>`;detail.showModal()};detail.querySelector('[data-close-detail]').addEventListener('click',()=>detail.close());list.addEventListener('click',async event=>{const button=event.target.closest('[data-detail]');if(!button)return;const response=await fetch('/freistellung-data',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(response.ok)showDetail((await response.json()).find(x=>x.id===button.dataset.detail));});
const filters=()=>({status:document.querySelector('#status').value,schoolYear:document.querySelector('#schoolYear').value,applicant:document.querySelector('#applicant').value,type:document.querySelector('#type').value});
async function load(){const r=await fetch('/freistellung-data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(filters())});if(!r.ok){list.textContent='Keine Berechtigung.';return}const a=await r.json();list.innerHTML=a.map(x=>{const orga=role.orga&&['EINGEREICHT','ORGA_RUECKSPRACHE'].includes(x.status),sl=role.sl&&x.status==='ORGA_ABGESCHLOSSEN';let form='';if(orga)form=`<form method="post" action="/freistellung-orga"><input type="hidden" name="id" value="${esc(x.id)}"><label>Orga-Einschätzung<select name="decision"><option value="GENEHMIGT">genehmigt</option><option value="GENEHMIGT_NACHHALTEN">genehmigt (Stunden müssen nachgehalten werden)</option><option value="NICHT_MOEGLICH">nicht möglich</option><option value="RUECKSPRACHE">Rücksprache erforderlich</option></select></label><label>Interner Kommentar für Schulleitung<textarea name="comment"></textarea></label><button>Orga speichern</button></form>`;if(sl)form=`<form method="post" action="/freistellung-sl"><input type="hidden" name="id" value="${esc(x.id)}"><label>Endgültige Entscheidung<select name="decision"><option value="GENEHMIGT">genehmigt</option><option value="GENEHMIGT_NACHHALTEN">genehmigt (Stunden müssen nachgehalten werden)</option><option value="NICHT_MOEGLICH">nicht möglich</option><option value="RUECKSPRACHE">Rücksprache erforderlich</option></select></label><label>Interner Kommentar für Orga<textarea name="internalComment"></textarea></label><label>Mitteilung an den Kollegen<textarea name="message"></textarea></label><button>Schulleitungsentscheidung speichern</button></form>`;const del=(role.orga||role.sl)?`<form class="delete-form" method="post" action="/freistellung-delete"><input type="hidden" name="id" value="${esc(x.id)}"><input type="hidden" name="confirmation" value="yes"><button class="danger" type="submit">Vorgang löschen</button></form>`:'';const attachment=x.attachment?`<a href="/freistellung-attachment?id=${encodeURIComponent(x.id)}">PDF-Anlage öffnen</a>`:'';return `<article class="request"><strong>${esc(x.type)}</strong> <span class="status">${esc(x.status)}</span><p>${esc(x.startDate)}–${esc(x.endDate)}, ${esc(x.applicant)} · Schuljahr ${esc(x.schoolYear)}</p>${attachment}${x.orgaDecision?`<p>Orga: ${esc(x.orgaDecision)}</p>`:''}${x.orgaComment?`<p class="private">Orga-Kommentar: ${esc(x.orgaComment)}</p>`:''}${x.slInternalComment?`<p class="private">SL-intern: ${esc(x.slInternalComment)}</p>`:''}${x.slMessage?`<p>Mitteilung: ${esc(x.slMessage)}</p>`:''}${form}${del}</article>`}).join('')||'Keine Vorgänge.';document.querySelectorAll('.delete-form').forEach(f=>f.addEventListener('submit',e=>{if(!confirm('Diesen Vorgang fachlich als gelöscht markieren? Die Anlage wird nicht physisch gelöscht.'))e.preventDefault()}))}
document.querySelector('#apply').addEventListener('click',load);(async()=>{const r=await fetch('/freistellung-role-info',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok){list.textContent='Keine Berechtigung.';return}role=await r.json();load()})();
</script></body></html>
