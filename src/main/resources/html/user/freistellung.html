<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freistellung</title><link rel="stylesheet" href="/freistellung.css"></head>
<body><main class="leave"><header><p class="eyebrow">Arcanum · Lehrkraft</p><h1>Freistellung</h1><p>Freistellungsanträge sicher einreichen und den Bearbeitungsstand verfolgen.</p></header>
<section class="card"><h2>Neuen Antrag erstellen</h2><form id="leave-form" enctype="multipart/form-data"><label>Art<select name="type"><option value="FORTBILDUNG">Freistellung Fortbildung</option><option value="DIENSTLICHE_GRUENDE">Freistellung dienstliche Gründe</option><option value="KLASSENFAHRT">Freistellung Klassenfahrt</option><option value="PERSOENLICHE_GRUENDE">Freistellung persönliche Gründe</option><option value="UNTERRICHTSGANG">Unterrichtsgang</option></select></label>
<div class="grid"><label>Startdatum<input type="date" name="startDate" required></label><label>Enddatum<input type="date" name="endDate" required></label><label>Startstunde<input type="number" min="1" max="9" name="startHour" required></label><label>Endstunde<input type="number" min="1" max="9" name="endHour" required></label></div>
<label id="group-wrap">Lerngruppe<input name="groupName"></label><label id="reason-wrap">Anlass / Begründung<textarea name="reason" rows="4" required></textarea></label><label>PDF-Anhang (optional, maximal 2 MiB)<input type="file" name="attachment" accept="application/pdf,.pdf"></label><p id="personal-note" hidden>Als Anlass wird unveränderlich „nach Rücksprache mit der Schulleitung“ eingetragen.</p><button>Einreichen</button><output id="form-message"></output></form></section>
<section class="card"><h2>Meine Anträge</h2><div id="requests" aria-live="polite">Lade Anträge …</div></section>
<dialog id="request-detail"><article><button type="button" data-close-detail>Schließen</button><div id="request-detail-content"></div></article></dialog>
</main><script src="/freistellung.js"></script></body></html>
