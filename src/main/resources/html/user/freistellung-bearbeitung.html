%[site;title=Freistellungen bearbeiten;content=!FOLLOWS]
<main id="freistellung-bearbeitung" class="teacher-dashboard leave"><header><p class="eyebrow">Lehrkraftbereich</p><h1>Freistellungen bearbeiten</h1><p>Gemeinsame Antragsansicht für Orga-Leitung und Schulleitung.</p></header>
<nav class="teacher-main-menu" aria-label="Lehrkraftbereiche"><div class="teacher-main-menu-sections">%[teacher_dashboard_nav]</div></nav>
<section class="card teacher-function-page filters"><label>Status<select id="status"><option value="">Alle</option><option value="EINGEREICHT">Offen</option><option value="ORGA_RUECKSPRACHE">Orga-Rücksprache</option><option value="ORGA_ABGESCHLOSSEN">Bei Schulleitung</option><option value="ABGESCHLOSSEN">Abgeschlossen</option></select></label><label>Schuljahr<input id="schoolYear" placeholder="2026/2027"></label><label>Antragsteller<input id="applicant" placeholder="Konto/E-Mail"></label><label>Antragsart<select id="type"><option value="">Alle</option><option value="FORTBILDUNG">Fortbildung</option><option value="DIENSTLICHE_GRUENDE">Dienstliche Gründe</option><option value="KLASSENFAHRT">Klassenfahrt</option><option value="PERSOENLICHE_GRUENDE">Persönliche Gründe</option><option value="UNTERRICHTSGANG">Unterrichtsgang</option></select></label><button id="apply" type="button">Filter anwenden</button></section>
<section class="card teacher-function-page"><div id="review-list" data-state="loading" role="status" aria-live="polite">Vorgänge werden geladen …</div></section>
<dialog id="request-detail"><article><button type="button" data-close-detail>Schließen</button><div id="request-detail-content"></div></article></dialog>
</main>
<script>
const list=document.querySelector('#review-list');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const berlinTime=value=>{if(!value)return '';const date=new Date(value);return Number.isNaN(date.getTime())?String(value):new Intl.DateTimeFormat('de-DE',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Berlin'}).format(date)};
let role={};
const detail=document.querySelector('#request-detail'),detailContent=document.querySelector('#request-detail-content');
const showDetail=x=>{if(!x)return;const rows=[['Antragsteller',x.applicant],['Antragsart',x.type],['Schuljahr',x.schoolYear],['Antragstellung',berlinTime(x.createdAt)],['Zeitraum',`${x.startDate}–${x.endDate}`],['Stunden',`${x.startHour}–${x.endHour}`],['Anlass / Begründung',x.reason],['Status',x.status],['Orga-Entscheidung',x.orgaDecision],['Orga-Kommentar (intern)',x.orgaComment],['SL-Entscheidung',x.slDecision],['SL-Hinweis an Orga (intern)',x.slInternalComment],['Mitteilung an Antragsteller',x.slMessage]].filter(([,value])=>value!==undefined&&value!==null&&value!=='');const legacyGroup=x.groupName?`<dt>Lerngruppe (historisch)</dt><dd>${esc(x.groupName)}</dd>`:'';detailContent.innerHTML=`<h2>Freistellungsantrag</h2><dl>${rows.map(([key,value])=>`<dt>${esc(key)}</dt><dd>${esc(value)}</dd>`).join('')}${legacyGroup}</dl>${x.attachment?`<p><a href="/freistellung-attachment?id=${encodeURIComponent(x.id)}">PDF-Anhang öffnen</a></p>`:''}<h3>Bearbeitungshistorie</h3><ol>${(x.history||[]).map(h=>`<li>${esc(berlinTime(h.at))} · ${esc(h.function)} · ${esc(h.detail)}</li>`).join('')}</ol>`;detail.showModal()};
detail.querySelector('[data-close-detail]').addEventListener('click',()=>detail.close());
const filters=()=>({status:document.querySelector('#status').value,schoolYear:document.querySelector('#schoolYear').value,applicant:document.querySelector('#applicant').value,type:document.querySelector('#type').value});
const setListState=(state,message)=>{list.dataset.state=state;list.replaceChildren();list.textContent=message;};
const fetchFreistellungJson=async(path,payload)=>{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);try{const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),credentials:'same-origin',cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error(response.status===403?'Keine Berechtigung.':'Vorgänge konnten nicht geladen werden.');let body=null;try{body=await response.json();}catch(_){throw new Error('Der Server hat keine gültigen Daten geliefert.');}return body;}catch(error){if(error.name==='AbortError')throw new Error('Der Server antwortet zu langsam. Bitte später erneut versuchen.');throw error;}finally{clearTimeout(timer);}};
async function load(){setListState('loading','Vorgänge werden geladen …');try{const requests=await fetchFreistellungJson('/freistellung-data',filters());if(!Array.isArray(requests))throw new Error('Ungültige Antwort vom Server.');if(!requests.length){setListState('empty','Keine Freistellungsanträge gefunden.');return;}list.dataset.state='success';list.replaceChildren();for(const x of requests){const article=document.createElement('article');article.className='request';const button=document.createElement('button');button.type='button';button.textContent='Alle Antragsdaten anzeigen';button.dataset.detail=x.id;button.addEventListener('click',()=>showDetail(x));article.append(button);const title=document.createElement('strong');title.textContent=` ${x.type} `;article.append(title);const status=document.createElement('span');status.className='status';status.textContent=x.status;article.append(status);const summary=document.createElement('p');summary.textContent=`${x.startDate}–${x.endDate}, ${x.applicant} · Schuljahr ${x.schoolYear}`;article.append(summary);if(x.attachment){const link=document.createElement('a');link.href=`/freistellung-attachment?id=${encodeURIComponent(x.id)}`;link.textContent='PDF-Anhang öffnen';article.append(link);}const orga=role.orga&&['EINGEREICHT','ORGA_RUECKSPRACHE'].includes(x.status),sl=role.sl&&x.status==='ORGA_ABGESCHLOSSEN';if(orga)article.append(decisionForm(x,'orga'));if(sl)article.append(decisionForm(x,'sl'));if(role.orga||role.sl)article.append(deleteForm(x));list.append(article);}}catch(error){setListState('error',error.message||'Vorgänge konnten nicht geladen werden.');}}
function decisionForm(x,kind){const form=document.createElement('form');form.method='post';form.action=kind==='orga'?'/freistellung-orga':'/freistellung-sl';const heading=document.createElement('h3');heading.textContent=kind==='orga'?'Bearbeitung als Orgaleitung':'Bearbeitung als Schulleitung';form.append(heading);const id=document.createElement('input');id.type='hidden';id.name='id';id.value=x.id;form.append(id);const label=document.createElement('label');label.textContent=kind==='orga'?'Einschätzung':'Entscheidung';const select=document.createElement('select');select.name='decision';[['GENEHMIGT','genehmigt'],['GENEHMIGT_NACHHALTEN','genehmigt (Stunden nachhalten)'],['NICHT_MOEGLICH','nicht möglich'],['RUECKSPRACHE','Rücksprache erforderlich']].forEach(([value,text])=>{const option=document.createElement('option');option.value=value;option.textContent=text;select.append(option)});label.append(select);form.append(label);const comment=document.createElement('textarea');comment.name=kind==='orga'?'comment':'internalComment';comment.placeholder=kind==='orga'?'Interne Mitteilung an die Schulleitung':'Interne Mitteilung an die Orgaleitung';form.append(comment);if(kind==='sl'){const message=document.createElement('textarea');message.name='message';message.placeholder='Abschlussmitteilung für Antragsteller und Orgaleitung';form.append(message)}const submit=document.createElement('button');submit.textContent='Speichern';form.append(submit);return form}
function deleteForm(x){const form=document.createElement('form');form.className='delete-form';form.method='post';form.action='/freistellung-delete';const id=document.createElement('input');id.type='hidden';id.name='id';id.value=x.id;const confirmation=document.createElement('input');confirmation.type='hidden';confirmation.name='confirmation';confirmation.value='yes';const button=document.createElement('button');button.className='danger';button.type='submit';button.textContent='Vorgang löschen';form.append(id,confirmation,button);form.addEventListener('submit',event=>{if(!confirm('Diesen Vorgang fachlich als gelöscht markieren?'))event.preventDefault()});return form}
document.querySelector('#apply').addEventListener('click',load);
(async()=>{setListState('loading','Vorgänge werden geladen …');try{role=await fetchFreistellungJson('/freistellung-role-info',{});if(!role||typeof role!=='object')throw new Error('Freistellungsrechte konnten nicht geladen werden.');await load();}catch(error){setListState('error',error.message||'Freistellungsrechte konnten nicht geladen werden.');}})();
</script>
